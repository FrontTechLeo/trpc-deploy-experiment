<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tRPC 微服务生产级治理体系 · 基础服务导航控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .glass-panel {
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .service-card {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(22, 30, 46, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .service-card:hover {
      transform: translateY(-4px);
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 12px 28px -4px rgba(99, 102, 241, 0.15), 0 8px 16px -4px rgba(0, 0, 0, 0.4);
      background: rgba(26, 36, 56, 0.8);
    }
    .badge {
      font-size: 0.72rem;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-weight: 600;
    }
    .copy-btn:hover {
      background: rgba(99, 102, 241, 0.25);
      color: #818cf8;
    }
    /* Toast message animation */
    #toast {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- 顶部导航栏 -->
  <header class="glass-panel sticky top-0 z-50 border-b border-slate-800/80 px-6 py-4">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>

        </div>
        <div>

            tRPC 微服务生产级治理体系 · 基础服务导航
          </h1>
          <p class="text-xs text-slate-400">一站式本地与生产级微服务中间件、CI/CD流水线、观测大盘与数仓运维入口</p>
        </div>
      </div>

      <!-- 动态 Host 切换栏 -->
      <div class="flex items-center bg-slate-900/90 rounded-xl border border-slate-700/60 p-1.5 shadow-inner">
        <span class="text-xs text-slate-400 px-2.5 font-medium flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          访问主机 (HOST):
        </span>
        <input 
          id="hostInput" 
          type="text" 
          class="bg-slate-800 text-cyan-300 font-mono text-xs px-3 py-1.5 rounded-lg border border-slate-700 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all w-40 text-center" 
          value=""
        />
        <button 
          onclick="applyHost()" 
          class="ml-2 text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-3 py-1.5 rounded-lg transition-colors shadow">
          应用切换
        </button>
        <button 
          onclick="setLocalhost()" 
          class="ml-1 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg transition-colors border border-slate-700">
          localhost
        </button>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full">
    
    <!-- 统计指示条与搜索筛选 -->
    <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
      
      <!-- 分类标签过滤器 -->
      <div id="filterTabs" class="flex flex-wrap gap-2 text-sm">
        <button onclick="filterCategory('all')" class="category-btn active px-3.5 py-1.5 rounded-lg font-medium text-xs bg-indigo-600 text-white shadow-sm transition">
          全部服务 (<span id="count-all">0</span>)
        </button>
        <button onclick="filterCategory('cicd')" class="category-btn px-3.5 py-1.5 rounded-lg font-medium text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition border border-slate-700/60">
          CI/CD 与交付发布 (<span id="count-cicd">0</span>)
        </button>
        <button onclick="filterCategory('infra')" class="category-btn px-3.5 py-1.5 rounded-lg font-medium text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition border border-slate-700/60">
          服务治理与中间件 (<span id="count-infra">0</span>)
        </button>
        <button onclick="filterCategory('monitor')" class="category-btn px-3.5 py-1.5 rounded-lg font-medium text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition border border-slate-700/60">
          可观测性与数仓 (<span id="count-monitor">0</span>)
        </button>
        <button onclick="filterCategory('gateway')" class="category-btn px-3.5 py-1.5 rounded-lg font-medium text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition border border-slate-700/60">
          业务网关与接口 (<span id="count-gateway">0</span>)
        </button>
      </div>

      <!-- 实时搜索输入框 -->
      <div class="relative w-full md:w-72">
        <svg class="w-4 h-4 absolute left-3.5 top-3 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input 
          id="searchInput" 
          type="text" 
          oninput="handleSearch()" 
          placeholder="搜索服务名称、端口、标签..." 
          class="w-full bg-slate-900/90 text-slate-200 text-xs pl-10 pr-4 py-2.5 rounded-xl border border-slate-700/80 focus:outline-none focus:border-indigo-500 transition-all placeholder:text-slate-500"
        />
      </div>
    </div>

    <!-- 服务卡片栅格布局 -->
    <div id="serviceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- 动态渲染卡片 -->
    </div>

    <!-- 无搜索结果提示 -->
    <div id="noResults" class="hidden text-center py-16">
      <div class="inline-flex p-4 rounded-full bg-slate-800/60 text-slate-400 mb-3">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <p class="text-sm text-slate-400 font-medium">未找到匹配的服务</p>
      <p class="text-xs text-slate-500 mt-1">请尝试更换关键字或切换分类标签</p>
    </div>

  </main>

  <!-- 底部说明与快捷命令 -->
  <footer class="glass-panel border-t border-slate-800/80 px-6 py-6 mt-12">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between text-xs text-slate-500 gap-4">
      <div class="flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span>环境状态：K3s (v1.37.2) + Docker 容器编排 (20+ 容器正常运行)</span>
      </div>
      <div class="flex items-center space-x-4">
        <span>架构体系：tRPC-Go 生产级同构微服务</span>
        <span>代码仓：<a href="https://github.com/FrontTechLeo/trpc-deploy-experiment.git" target="_blank" class="text-indigo-400 hover:underline">GitHub</a></span>
      </div>
    </div>
  </footer>

  <!-- 复制成功的浮动 Toast -->

    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
    </svg>
    <span id="toastMsg">已成功复制到剪贴板！</span>

        categoryName: "调用追踪",
        port: 16686,
        protocol: "http",
        path: "/",
        urlOverride: null,
        desc: "分布式 Trace 追踪系统，支持 OTLP 协议，呈现微服务跨节点、跨数据库调用的完整耗时瀑布图。",
        account: "无需账号",
        password: "免密",
        extraHint: "OTLP gRPC: 4317 / HTTP: 4318",
        badgeColor: "bg-cyan-500/10 text-cyan-400 border border-cyan-500/20",
        icon: `<svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>`
      },
      {
        id: "clickhouse",
        name: "ClickHouse 实时数仓 (OLAP)",
        category: "monitor",
        categoryName: "实时OLAP",
        port: 8123,
        protocol: "http",
        path: "/play",
        urlOverride: null,
        desc: "极速列式存储分析数据库，秒级承载高频业务埋点流（关卡、击杀、充值），支撑实时运营看板。",
        account: "default",
        password: "免密",
        extraHint: "TCP 端口: 9009 (避开 MinIO 9000)",
        badgeColor: "bg-yellow-500/10 text-yellow-400 border border-yellow-500/20",
        icon: `<svg class="w-6 h-6 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>`
      },
      {
        id: "duckdb",
        name: "DuckDB 极速离线数据湖",
        category: "monitor",
        categoryName: "Serverless湖仓",
        port: 0,
        protocol: "cli",
        path: null,
        urlOverride: null,
        desc: "进程内 Serverless 分析引擎，0守护进程直读 MinIO S3 Parquet 文件，并跨源联邦关联 TiDB。",
        account: "CLI 命令行",
        password: "无需密码",
        extraHint: "运行脚本: scripts/lakehouse-sync.sh",
        badgeColor: "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20",
        icon: `<svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>`
      },

      // 4. 业务网关与微服务
      {
        id: "gateway",
        name: "tRPC-Gateway 统一业务网关",
        category: "gateway",
        categoryName: "API网关",
        port: 8088,
        protocol: "http",
        path: "/api/v1/auth/login",
        urlOverride: null,
        desc: "基于 FastHTTP 的统一入口网关，负责 CORS 处理、JWT 鉴权校验并将 RESTful JSON 转为 tRPC RPC。",
        account: "REST API",
        password: "无需密码",
        extraHint: "业务微服务代理根入口",
        badgeColor: "bg-indigo-500/10 text-indigo-400 border border-indigo-500/20",
        icon: `<svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path></svg>`
      }
    ];

    // 初始化主机地址（自动检测浏览器当前的 host）
    let currentHost = window.location.hostname || "192.168.137.240";
    let currentCategory = "all";
    let searchQuery = "";

    // DOM 加载就绪
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("hostInput").value = currentHost;
      updateCounts();
      renderCards();
    });

    // 应用 Host
    function applyHost() {
      const inputVal = document.getElementById("hostInput").value.trim();
      if (inputVal) {
        currentHost = inputVal;
        showToast("已更新目标主机为: " + currentHost);
        renderCards();
      }
    }

    // 设置为 localhost
    function setLocalhost() {
      currentHost = "localhost";
      document.getElementById("hostInput").value = "localhost";
      showToast("已切换目标主机为: localhost");
      renderCards();
    }

    // 分类切换
    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".category-btn").forEach(btn => {
        btn.classList.remove("active", "bg-indigo-600", "text-white");
        btn.classList.add("bg-slate-800/80", "text-slate-300");
      });
      event.target.classList.add("active", "bg-indigo-600", "text-white");
      event.target.classList.remove("bg-slate-800/80", "text-slate-300");
      renderCards();
    }

    // 搜索过滤
    function handleSearch() {
      searchQuery = document.getElementById("searchInput").value.trim().toLowerCase();
      renderCards();
    }

    // 统计每类服务数量
    function updateCounts() {
      document.getElementById("count-all").innerText = SERVICES.length;
      document.getElementById("count-cicd").innerText = SERVICES.filter(s => s.category === "cicd").length;
      document.getElementById("count-infra").innerText = SERVICES.filter(s => s.category === "infra").length;
      document.getElementById("count-monitor").innerText = SERVICES.filter(s => s.category === "monitor").length;
      document.getElementById("count-gateway").innerText = SERVICES.filter(s => s.category === "gateway").length;
    }

    // 渲染卡片核心逻辑
    function renderCards() {
      const grid = document.getElementById("serviceGrid");
      const noResults = document.getElementById("noResults");
      grid.innerHTML = "";

      const filtered = SERVICES.filter(svc => {
        const matchCategory = (currentCategory === "all") || (svc.category === currentCategory);
        const matchSearch = !searchQuery || 
          svc.name.toLowerCase().includes(searchQuery) ||
          svc.desc.toLowerCase().includes(searchQuery) ||
          svc.port.toString().includes(searchQuery) ||
          svc.categoryName.toLowerCase().includes(searchQuery);
        return matchCategory && matchSearch;
      });

      if (filtered.length === 0) {
        noResults.classList.remove("hidden");
        return;
      }
      noResults.classList.add("hidden");

      filtered.forEach(svc => {
        // 构建实际目标 URL
        let targetUrl = "#";
        let isWebUI = false;
        if (svc.protocol === "http" || svc.protocol === "https") {
          targetUrl = `${svc.protocol}://${currentHost}:${svc.port}${svc.path || ""}`;
          isWebUI = true;
        }

        const card = document.createElement("div");
        card.className = "service-card rounded-2xl p-5 flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <!-- 卡片头部信息 -->
            <div class="flex items-start justify-between gap-3 mb-3">
              <div class="flex items-center space-x-3">
                <div class="p-2.5 rounded-xl bg-slate-800/80 border border-slate-700/60 shadow-inner">
                  ${svc.icon}
                </div>
                <div>
                  <h3 class="text-sm font-bold text-white tracking-wide">${svc.name}</h3>
                  <div class="flex items-center gap-2 mt-0.5">
                    <span class="badge ${svc.badgeColor}">${svc.categoryName}</span>
                    <span class="text-[11px] text-slate-400 font-mono">${svc.port > 0 ? `Port: ${svc.port}` : svc.protocol.toUpperCase()}</span>
                  </div>
                </div>
              </div>
              <span class="flex h-2.5 w-2.5 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
              </span>
            </div>

            <!-- 服务描述说明 -->
            <p class="text-xs text-slate-400 leading-relaxed mb-4 min-h-[36px]">
              ${svc.desc}
            </p>

            <!-- 账号密码展示盒 -->
            <div class="bg-slate-900/80 rounded-xl p-3 border border-slate-800 space-y-2 mb-4 font-mono text-xs">
              <div class="flex items-center justify-between">
                <span class="text-slate-500">账号:</span>
                <div class="flex items-center space-x-1.5">
                  <span class="text-slate-200 font-medium">${svc.account}</span>
                  ${svc.account !== '无需账号' && svc.account !== 'REST API' && svc.account !== 'CLI 命令行' ? `
                    <button onclick="copyText('${svc.account}', '账号已复制')" class="copy-btn p-1 rounded text-slate-400 hover:text-indigo-400 transition" title="复制账号">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </button>
                  ` : ''}
                </div>
              </div>
              <div class="flex items-center justify-between">
                <span class="text-slate-500">密码:</span>
                <div class="flex items-center space-x-1.5">
                  <span class="text-cyan-400 font-semibold">${svc.password}</span>
                  ${svc.password !== '免密' && svc.password !== '无需密码' && svc.password !== '纯 API' && svc.password !== '点击授权即登' ? `
                    <button onclick="copyText('${svc.password}', '密码已复制')" class="copy-btn p-1 rounded text-slate-400 hover:text-indigo-400 transition" title="复制密码">
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </button>
                  ` : ''}
                </div>
              </div>
              ${svc.extraHint ? `
                <div class="text-[10px] text-slate-500 border-t border-slate-800/80 pt-1.5 flex items-center justify-between">
                  <span>提示:</span>
                  <span class="text-slate-400 truncate max-w-[200px]" title="${svc.extraHint}">${svc.extraHint}</span>
                </div>
              ` : ''}
            </div>
          </div>

          <!-- 底部直达按钮操作区 -->
          <div class="pt-2 border-t border-slate-800/60">
            ${isWebUI ? `
              <a 
                href="${targetUrl}" 
                target="_blank" 
                class="w-full flex items-center justify-center space-x-1.5 bg-indigo-600/90 hover:bg-indigo-600 text-white font-medium text-xs py-2 rounded-xl transition-all shadow-md shadow-indigo-600/20 group">
                <span>打开 WebUI</span>
                <svg class="w-3.5 h-3.5 transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                </svg>
              </a>
            ` : `
              <div class="flex items-center justify-between text-xs py-1.5 px-3 rounded-xl bg-slate-800/50 text-slate-400 font-mono">
                <span>${svc.protocol === 'tcp' ? `连通方式: ${currentHost}:${svc.port}` : 'CLI 命令行工具'}</span>
                <button onclick="copyText('${svc.port > 0 ? `${currentHost}:${svc.port}` : 'duckdb'}', '连接串已复制')" class="copy-btn text-indigo-400 hover:text-indigo-300 text-[11px] font-sans">
                  复制连接
                </button>
              </div>
            `}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // 复制到剪贴板
    function copyText(text, msg) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(msg || "已复制: " + text);
        }).catch(() => {
          fallbackCopy(text, msg);
        });
      } else {
        fallbackCopy(text, msg);
      }
    }

    // 降级复制机制
    function fallbackCopy(text, msg) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        showToast(msg || "已复制: " + text);
      } catch (err) {
        showToast("复制失败，请手动选取");
      }
      document.body.removeChild(textArea);
    }

    // 提示 Toast
    function showToast(msg) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      toastMsg.innerText = msg;
      toast.classList.remove("opacity-0", "pointer-events-none", "translate-y-2");
      toast.classList.add("opacity-100", "translate-y-0");

      setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "pointer-events-none", "translate-y-2");
      }, 2500);
    }
  </script>
</body>
</html>
