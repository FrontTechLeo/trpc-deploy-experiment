global:
  namespace: Development
  env_name: test

server:
  app: gametool
  server: game
  bin_path: ./
  conf_path: ./conf/
  data_path: ./data/
  service:
    - name: trpc.gametool.game.v1.GameService
      ip: "${POD_IP}"
      port: 10003
      network: tcp
      protocol: trpc
      timeout: 3000

plugins:
  log:
    default:
      - writer: console
        level: debug
  registry:
    polarismesh:
      register_self: true
      heartbeat_interval: 3000
      protocol: grpc
      address_list: "192.168.137.240:8091"
      service:
        - name: trpc.gametool.game.v1.GameService
          namespace: Development
          token: "polaris_token"
          weight: 100
