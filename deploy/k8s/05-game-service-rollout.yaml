apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: game-service-rollout
  namespace: gametool
  labels:
    app: game-service
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: game-service
  template:
    metadata:
      labels:
        app: game-service
    spec:
      containers:
        - name: game-service
          image: localhost:5000/gametool/game-service:v1.0.0
          imagePullPolicy: Always
          ports:
            - name: trpc
              containerPort: 10003
            - name: admin
              containerPort: 10004
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POLARIS_ADDR
              value: "192.168.137.240:8091"
            - name: MYSQL_DSN
              value: "root:root@tcp(192.168.137.240:3306)/gametool?parseTime=true&charset=utf8mb4"
            - name: REDIS_ADDR
              value: "192.168.137.240:6379"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@192.168.137.240:5672/"
            - name: CLICKHOUSE_URL
              value: "http://192.168.137.240:8123"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
  strategy:
    canary:
      canaryService: game-service-canary
      stableService: game-service-stable
      steps:
        - setWeight: 25
        - pause: { duration: 10s }
        - setWeight: 50
        - pause: { duration: 10s }
        - setWeight: 100
