apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: gametool
  labels:
    app: trpc-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trpc-gateway
  template:
    metadata:
      labels:
        app: trpc-gateway
    spec:
      containers:
        - name: gateway
          image: localhost:5000/gametool/gateway:v1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POLARIS_ADDR
              value: "192.168.137.240:8091"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: gametool
  labels:
    app: trpc-gateway
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30880
  selector:
    app: trpc-gateway
