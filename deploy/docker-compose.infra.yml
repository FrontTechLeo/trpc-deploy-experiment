version: '3.8'

services:
  polaris:
    image: polarismesh/polaris-server:latest
    container_name: polaris-standalone
    restart: always
    ports:
      - "8090:8090" # Web 控制台 (Console)
      - "8091:8091" # gRPC 注册发现端口
      - "8093:8093" # HTTP 配置与服务接口
    environment:
      - POLARIS_MODE=standalone
    volumes:
      - polaris_data:/root/polaris/data

  redis:
    image: redis:7.2-alpine
    container_name: local-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  mysql:
    image: mysql:8.0
    container_name: local-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gametool
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: local-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP 业务通信端口
      - "15672:15672" # Web 管理控制台端口
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:latest
    container_name: local-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API 访问端点
      - "9001:9001"   # Web 管理控制台端点
    volumes:
      - minio_data:/data

  mongodb:
    image: mongo:7.0
    container_name: local-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongoadmin
    ports:
      - "27017:27017" # MongoDB 协议端口
    volumes:
      - mongo_data:/data/db

volumes:
  polaris_data:
  redis_data:
  mysql_data:
  rabbitmq_data:
  minio_data:
  mongo_data:
