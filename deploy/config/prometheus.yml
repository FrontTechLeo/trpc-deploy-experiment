global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'trpc-services'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['192.168.137.240:19090', '192.168.137.240:19091'] # 宿主机微服务监控端口
